<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"

<title>Anunciar Figurinha</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

    font-family:'Inter', sans-serif;

        <a

<section class="py-12 px-4">

    <div class="max-w-2xl mx-auto bg-white rounded-[2rem] p-8 shadow-2xl">

        <div class="mb-8">

            <span class="bg-green-100 text-green-700 px-4 py-2 rounded-full text-xs font-black uppercase">

            </span>

            <h1 class="text-4xl font-black mt-5">

<script type="module">

import { auth, db, storage } from './firebase.js';

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

import {
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

import {
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-storage.js";


// ======================================
// ELEMENTOS
// ======================================

const btn =
    document.getElementById('publicarBtn');

const numero =
    document.getElementById('numero');

const jogador =
    document.getElementById('jogador');

const selecao =
    document.getElementById('selecao');

const tipo =
    document.getElementById('tipo');

const preco =
    document.getElementById('preco');

const cidade =
    document.getElementById('cidade');

const fotoInput =
    document.getElementById('foto');


// ======================================
// GPS
// ======================================

let uLat = null;
let uLng = null;

let localizacaoAtiva = false;

let tentativaSemGPS =
    parseInt(
        localStorage.getItem('tentativaSemGPS')
    ) || 0;


// ======================================
// GEOLOCALIZAÇÃO
// ======================================

navigator.geolocation.getCurrentPosition(

    (pos)=>{

        uLat = pos.coords.latitude;
        uLng = pos.coords.longitude;

        localizacaoAtiva = true;

        console.log("GPS ATIVO");

    },

    (err)=>{

        console.log("GPS NÃO ATIVADO");

    }

);


// ======================================
// AUTH
// ======================================

onAuthStateChanged(auth, (user)=>{

    if(!user){

        alert("Faça login.");

        window.location.href =
            "login.html";

    }

});


// ======================================
// PUBLICAR
// ======================================

window.publicar = async function(){

    if (!auth.currentUser) {

        alert("Faça login.");

        return;

    }

    // ======================================
    // GPS NÃO ATIVADO
    // ======================================

    if (!localizacaoAtiva) {

        tentativaSemGPS++;

        localStorage.setItem(
            'tentativaSemGPS',
            tentativaSemGPS
        );

        // PRIMEIRA TENTATIVA
        if (tentativaSemGPS <= 1) {

            alert(
                "Ative sua localização para aumentar a segurança das negociações e receber selo verificado."
            );

            return;
        }

    }

    btn.innerHTML = "PUBLICANDO...";

    btn.disabled = true;

    try {

        let fotoURL = "";

        // ======================================
        // UPLOAD FOTO
        // ======================================

        if (fotoInput.files[0]) {

            const arquivo =
                fotoInput.files[0];

            const storageRef =
                ref(
                    storage,
                    `figurinhas/${Date.now()}`
                );

            await uploadBytes(
                storageRef,
                arquivo
            );

            fotoURL =
                await getDownloadURL(storageRef);

        }

        // ======================================
        // FIRESTORE
        // ======================================

        await addDoc(
            collection(db, "anuncios"),
            {

                uid:
                    auth.currentUser.uid,

                nome:
                    auth.currentUser.displayName || "",

                numero:
                    numero.value,

                jogador:
                    jogador.value,

                selecao:
                    selecao.value,

                tipo:
                    tipo.value,

                preco:
                    preco.value,

                cidade:
                    cidade.value,

                foto:
                    fotoURL,

                lat:
                    uLat || null,

                lng:
                    uLng || null,

                // ==================================
                // VERIFICAÇÃO
                // ==================================

                verificado:
                    localizacaoAtiva,

                alerta:
                    !localizacaoAtiva,

                // ==================================
                // STATUS
                // ==================================

                status:
                    "aprovado",

                destaque:
                    false,

                criadoEm:
                    serverTimestamp()

            }
        );

        // ======================================
        // RESET
        // ======================================

        localStorage.removeItem(
            'tentativaSemGPS'
        );

        alert(

            localizacaoAtiva

            ?

            "Figurinha publicada com selo verificado."

            :

            "Figurinha publicada como NÃO VERIFICADA."

        );

        window.location.href =
            "dashboard.html";

    }

    catch (e) {

        console.error(e);

        alert("Erro ao publicar.");

    }

    btn.innerHTML =
        "PUBLICAR FIGURINHA";

    btn.disabled = false;

}

</script>

</body>
</html>
