```html id="3lb3wf"
<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Anunciar Figurinha</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
rel="stylesheet"
>

<style>

body{
    font-family:'Inter', sans-serif;
}

.glass{
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(14px);
}

</style>

</head>

<body class="bg-gray-100 min-h-screen">

<header class="sticky top-0 z-50 glass border-b border-gray-200">

    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">

        <a
            href="index.html"
            class="text-3xl font-black text-green-600 italic"
        >
            FigurinhasCup
        </a>

        <a
            href="index.html"
            class="text-sm font-bold"
        >
            Voltar
        </a>

    </div>

</header>

<section class="py-12 px-4">

    <div class="max-w-2xl mx-auto bg-white rounded-[2rem] p-8 shadow-2xl">

        <div class="mb-8">

            <span class="bg-green-100 text-green-700 px-4 py-2 rounded-full text-xs font-black uppercase">
                Novo anúncio
            </span>

            <h1 class="text-4xl font-black mt-5">
                Publicar figurinha
            </h1>

            <p class="text-gray-500 mt-3">
                Cadastre sua figurinha e encontre colecionadores próximos.
            </p>

        </div>

        <form id="formAnuncio" class="space-y-5">

            <div>

                <label class="text-sm font-bold block mb-2">
                    Foto da figurinha
                </label>

                <input
                    type="file"
                    id="foto"
                    accept="image/*"
                    required
                    class="w-full p-4 rounded-2xl bg-gray-100"
                >

            </div>

            <img
                id="preview"
                class="hidden w-full h-72 object-cover rounded-2xl"
            >

            <div class="grid md:grid-cols-2 gap-4">

                <input
                    type="text"
                    id="numero"
                    placeholder="Número"
                    required
                    class="p-4 rounded-2xl bg-gray-100 outline-none"
                >

                <input
                    type="text"
                    id="jogador"
                    placeholder="Jogador"
                    required
                    class="p-4 rounded-2xl bg-gray-100 outline-none"
                >

            </div>

            <input
                type="text"
                id="selecao"
                placeholder="Seleção"
                required
                class="w-full p-4 rounded-2xl bg-gray-100 outline-none"
            >

            <textarea
                id="descricao"
                placeholder="Descrição da figurinha"
                class="w-full p-4 rounded-2xl bg-gray-100 outline-none h-32 resize-none"
            ></textarea>

            <div class="grid md:grid-cols-2 gap-4">

                <select
                    id="tipo"
                    class="p-4 rounded-2xl bg-gray-100 outline-none"
                >

                    <option value="Venda">
                        Venda
                    </option>

                    <option value="Troca">
                        Troca
                    </option>

                    <option value="Venda ou troca">
                        Venda ou troca
                    </option>

                </select>

                <select
                    id="raridade"
                    class="p-4 rounded-2xl bg-gray-100 outline-none"
                >

                    <option value="Comum">
                        Comum
                    </option>

                    <option value="Rara">
                        Rara
                    </option>

                    <option value="Brilhante">
                        Brilhante
                    </option>

                    <option value="Legend">
                        Legend
                    </option>

                </select>

            </div>

            <div class="grid md:grid-cols-2 gap-4">

                <input
                    type="number"
                    id="preco"
                    placeholder="Preço R$"
                    required
                    class="p-4 rounded-2xl bg-gray-100 outline-none"
                >

                <input
                    type="text"
                    id="whatsapp"
                    placeholder="WhatsApp"
                    required
                    class="p-4 rounded-2xl bg-gray-100 outline-none"
                >

            </div>

            <div
                id="locationInfo"
                class="bg-green-50 border border-green-200 rounded-2xl p-4 text-sm font-bold text-green-700"
            >
                📍 Obtendo localização...
            </div>

            <button
                id="btnPublicar"
                class="w-full bg-green-600 text-white p-5 rounded-2xl text-lg font-black hover:scale-[1.01] transition-all"
            >
                PUBLICAR ANÚNCIO
            </button>

        </form>

    </div>

</section>

<script type="module">

import {
    auth,
    db,
    storage
} from './firebase.js';

import {

    onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

import {

    collection,
    addDoc,
    serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

import {

    ref,
    uploadBytes,
    getDownloadURL

} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-storage.js";

let cidade = "";
let estado = "";
let lat = null;
let lng = null;

onAuthStateChanged(auth, (user)=>{

    if(!user){

        window.location.href = "login.html";

    }

});

navigator.geolocation.getCurrentPosition(async(pos)=>{

    lat = pos.coords.latitude;
    lng = pos.coords.longitude;

    try{

        const res =
            await fetch(
                `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`
            );

        const data = await res.json();

        cidade =
            data.address.city ||
            data.address.town;

        estado =
            data.address.state;

        document.getElementById('locationInfo').innerHTML = `
            📍 ${cidade} - ${estado}
        `;

    }catch(error){

        document.getElementById('locationInfo').innerHTML =
            "❌ Não foi possível obter localização";

    }

});

const fotoInput =
    document.getElementById('foto');

const preview =
    document.getElementById('preview');

fotoInput.addEventListener('change', ()=>{

    const file =
        fotoInput.files[0];

    if(file){

        preview.src =
            URL.createObjectURL(file);

        preview.classList.remove('hidden');

    }

});

document
.getElementById('formAnuncio')
.addEventListener('submit', async(e)=>{

    e.preventDefault();

    const btn =
        document.getElementById('btnPublicar');

    btn.innerHTML =
        "PUBLICANDO...";

    btn.disabled = true;

    try{

        const file =
            fotoInput.files[0];

        const storageRef =
            ref(
                storage,
                'figurinhas/' +
                Date.now() +
                "_" +
                file.name
            );

        await uploadBytes(
            storageRef,
            file
        );

        const fotoURL =
            await getDownloadURL(storageRef);

        await addDoc(
            collection(db, "anuncios"),
            {

                numero:
                    document.getElementById('numero').value,

                jogador:
                    document.getElementById('jogador').value,

                selecao:
                    document.getElementById('selecao').value,

                descricao:
                    document.getElementById('descricao').value,

                tipo:
                    document.getElementById('tipo').value,

                raridade:
                    document.getElementById('raridade').value,

                preco:
                    document.getElementById('preco').value,

                whatsapp:
                    document.getElementById('whatsapp').value,

                cidade,
                estado,
                lat,
                lng,

                foto: fotoURL,

                uid: auth.currentUser.uid,

                criadoEm:
                    serverTimestamp()

            }
        );

        alert("Anúncio publicado!");

        window.location.href =
            "index.html";

    }catch(error){

        alert(error.message);

        btn.innerHTML =
            "PUBLICAR ANÚNCIO";

        btn.disabled = false;

    }

});

</script>

</body>
</html>
```
