<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro | FigurinhasCup</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
body{
    font-family: 'Inter', sans-serif;
}
</style>

</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

<div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl">

    <div class="text-center mb-8">
        <h1 class="text-4xl font-black text-green-600 italic">
            FigurinhasCup
        </h1>

        <p class="text-gray-500 mt-2">
            Crie sua conta gratuitamente
        </p>
    </div>

    <form id="registerForm" class="space-y-4">

        <input
            type="text"
            id="nome"
            placeholder="Seu nome"
            class="w-full p-4 rounded-2xl bg-gray-100 outline-none focus:ring-2 focus:ring-green-500"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Seu email"
            class="w-full p-4 rounded-2xl bg-gray-100 outline-none focus:ring-2 focus:ring-green-500"
            required
        >

        <input
            type="tel"
            id="whatsapp"
            placeholder="WhatsApp com DDD"
            inputmode="numeric"
            minlength="10"
            maxlength="15"
            class="w-full p-4 rounded-2xl bg-gray-100 outline-none focus:ring-2 focus:ring-green-500"
            required
        >

        <input
            type="password"
            id="senha"
            placeholder="Sua senha"
            class="w-full p-4 rounded-2xl bg-gray-100 outline-none focus:ring-2 focus:ring-green-500"
            required
        >

        <button
            class="w-full bg-green-600 text-white p-4 rounded-2xl font-black text-lg hover:scale-[1.02] transition"
        >
            CRIAR CONTA
        </button>

    </form>

    <div class="text-center mt-6">
        <a href="login.html" class="text-green-600 font-bold">
            Já possui conta? Entrar
        </a>
    </div>

</div>

<script type="module">

import {
    auth,
    db
} from './firebase.js';

import {
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const form = document.getElementById('registerForm');

function limparTelefone(valor){
    return String(valor || "").replace(/\D/g, "");
}

form.addEventListener('submit', async(e)=>{

    e.preventDefault();

    const nome = document.getElementById('nome').value.trim();
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    const whatsapp = limparTelefone(
        document.getElementById('whatsapp').value
    );

    if(whatsapp.length < 10 || whatsapp.length > 11){

        alert("Informe um WhatsApp válido com DDD.");

        return;

    }

    try{

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                senha
            );

        const user = userCredential.user;

        await setDoc(
            doc(db, "usuarios", user.uid),
            {
                nome,
                email,
                whatsapp,
                criadoEm: serverTimestamp()
            }
        );

        localStorage.setItem(
            "compradorWhatsApp",
            whatsapp
        );

        alert("Conta criada com sucesso!");

        window.location.href = "index.html";

    }catch(error){

        alert(error.message);

    }

});

</script>

</body>
</html>
