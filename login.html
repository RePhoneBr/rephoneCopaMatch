<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Login | FigurinhasCup</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
rel="stylesheet"
>

<style>

:root{

    --title-big: clamp(2.2rem, 5vw, 4.5rem);

    --title-medium: clamp(1.5rem, 3vw, 2.5rem);

    --text-normal: clamp(0.92rem, 1vw, 1rem);

    --text-small: clamp(0.78rem, 1vw, 0.92rem);

}

html{

    font-size: clamp(14px, 1vw, 18px);

}

*{
    box-sizing:border-box;
}

body{
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
}

img{
    max-width:100%;
    height:auto;
}

.glass{

    background: rgba(255,255,255,0.92);

    backdrop-filter: blur(12px);

}

.input-style{

    width:100%;

    padding:0.95rem 1rem;

    border-radius:1.2rem;

    background:#f3f4f6;

    outline:none;

    transition:0.2s;

    font-size:var(--text-normal);

}

.input-style:focus{

    box-shadow:0 0 0 3px rgba(34,197,94,0.25);

}

.btn-main{

    width:100%;

    background:#16a34a;

    color:white;

    padding:1rem;

    border-radius:1.2rem;

    font-weight:900;

    font-size:clamp(1rem,2vw,1.1rem);

    transition:0.25s;

}

.btn-main:hover{

    transform:translateY(-2px);

    box-shadow:0 15px 30px rgba(22,163,74,0.25);

}

</style>

</head>

<body class="bg-gradient-to-br from-green-50 to-white min-h-screen flex items-center justify-center p-4 sm:p-6">

<div
class="
glass
w-full
max-w-md
rounded-[2rem]
p-5
sm:p-8
shadow-2xl
border
border-white
"
>

    <!-- LOGO -->

    <div class="text-center mb-8">

        <h1
        class="
        font-black
        text-green-600
        italic
        tracking-tight
        leading-none
        "
        style="font-size:var(--title-big)"
        >
            FigurinhasCup
        </h1>

        <p
        class="text-gray-500 mt-4"
        style="font-size:var(--text-normal)"
        >
            Entre na sua conta para anunciar figurinhas
        </p>

    </div>

    <!-- FORM -->

    <form
    id="loginForm"
    class="space-y-4"
    >

        <!-- EMAIL -->

        <input
            type="email"
            id="email"
            placeholder="Seu email"
            required
            class="input-style"
        >

        <!-- SENHA -->

        <div class="relative">

            <input
                type="password"
                id="senha"
                placeholder="Sua senha"
                required
                class="input-style pr-24"
            >

            <button
                type="button"
                id="toggleSenha"
                class="
                absolute
                right-4
                top-1/2
                -translate-y-1/2
                text-gray-500
                font-bold
                "
                style="font-size:var(--text-small)"
            >
                Mostrar
            </button>

        </div>

        <!-- BOTÃO -->

        <button class="btn-main">

            ENTRAR

        </button>

    </form>

    <!-- RECUPERAR -->

    <div class="text-center mt-5">

        <button
            id="btnRecuperar"
            class="
            text-gray-500
            hover:text-green-600
            transition
            font-bold
            "
            style="font-size:var(--text-small)"
        >
            Esqueci minha senha
        </button>

    </div>

    <!-- REGISTRO -->

    <div class="text-center mt-6">

        <a
            href="registro.html"
            class="
            text-green-600
            font-bold
            hover:opacity-80
            transition
            "
            style="font-size:var(--text-small)"
        >
            Criar nova conta
        </a>

    </div>

    <!-- ALERTAS -->

    <div
        id="msgBox"
        class="hidden mt-6 rounded-2xl p-4 font-bold"
        style="font-size:var(--text-small)"
    ></div>

</div>

<script type="module">

import {
    auth
} from './firebase.js';

import {

    signInWithEmailAndPassword,

    onAuthStateChanged,

    sendPasswordResetEmail

}
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

const form =
    document.getElementById('loginForm');

const msgBox =
    document.getElementById('msgBox');


// ========================================
// ALERTAS
// ========================================

function mostrarMensagem(msg, tipo = 'erro'){

    msgBox.classList.remove('hidden');

    if(tipo === 'sucesso'){

        msgBox.className =
        'mt-6 rounded-2xl p-4 font-bold bg-green-100 text-green-700';

    }else{

        msgBox.className =
        'mt-6 rounded-2xl p-4 font-bold bg-red-100 text-red-700';

    }

    msgBox.innerHTML = msg;

}


// ========================================
// VERIFICA LOGIN
// ========================================

onAuthStateChanged(auth, (user)=>{

    if(user){

        console.log("Usuário logado");

    }

});


// ========================================
// LOGIN
// ========================================

form.addEventListener('submit', async(e)=>{

    e.preventDefault();

    const email =
        document.getElementById('email').value;

    const senha =
        document.getElementById('senha').value;

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            senha
        );

        mostrarMensagem(
            "Login realizado com sucesso.",
            "sucesso"
        );

        setTimeout(()=>{

            window.location.href =
                "index.html";

        },1000);

    }

    catch(error){

        console.error(error);

        mostrarMensagem(
            "Email ou senha inválidos."
        );

    }

});


// ========================================
// RECUPERAR SENHA
// ========================================

const btnRecuperar =
    document.getElementById('btnRecuperar');

let tempoRecuperacao = 60;
let intervaloRecuperacao = null;

function bloquearRecuperacao(){

    btnRecuperar.disabled = true;

    btnRecuperar.classList.add(
        'opacity-50',
        'cursor-not-allowed'
    );

    tempoRecuperacao = 60;

    btnRecuperar.innerHTML =
        `Aguarde ${tempoRecuperacao}s`;

    intervaloRecuperacao =
        setInterval(()=>{

            tempoRecuperacao--;

            btnRecuperar.innerHTML =
                `Aguarde ${tempoRecuperacao}s`;

            if(tempoRecuperacao <= 0){

                clearInterval(intervaloRecuperacao);

                intervaloRecuperacao = null;

                btnRecuperar.disabled = false;

                btnRecuperar.classList.remove(
                    'opacity-50',
                    'cursor-not-allowed'
                );

                btnRecuperar.innerHTML =
                    "Esqueci minha senha";

            }

        },1000);

}

btnRecuperar.addEventListener('click', async()=>{

    if(btnRecuperar.disabled){
        return;
    }

    const email =
        document.getElementById('email').value.trim();

    if(!email){

        mostrarMensagem(
            "Digite seu email cadastrado para recuperar a senha."
        );

        return;

    }

    try{

        await sendPasswordResetEmail(
            auth,
            email
        );

        mostrarMensagem(
            "Enviamos um link para o email cadastrado. Acesse sua caixa de entrada e crie uma nova senha pelo link enviado.",
            "sucesso"
        );

        bloquearRecuperacao();

    }

    catch(error){

        console.error(error);

        if(error.code === 'auth/user-not-found'){

            mostrarMensagem(
                "Nenhuma conta encontrada com este email."
            );

        }else if(error.code === 'auth/invalid-email'){

            mostrarMensagem(
                "Digite um email válido."
            );

        }else{

            mostrarMensagem(
                "Erro ao enviar recuperação. Tente novamente."
            );

        }

    }

});


// ========================================
// MOSTRAR SENHA
// ========================================

document
.getElementById('toggleSenha')
.addEventListener('click', ()=>{

    const senha =
        document.getElementById('senha');

    if(senha.type === 'password'){

        senha.type = 'text';

        document
        .getElementById('toggleSenha')
        .innerHTML = 'Ocultar';

    }else{

        senha.type = 'password';

        document
        .getElementById('toggleSenha')
        .innerHTML = 'Mostrar';

    }

});

</script>

</body>
</html>
