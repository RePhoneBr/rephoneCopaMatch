<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | FigurinhasCup</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Inter', sans-serif;
}

.glass{
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
}

</style>

</head>

<body class="bg-gradient-to-br from-green-50 to-white min-h-screen flex items-center justify-center p-6">

<div class="glass w-full max-w-md rounded-[2rem] p-8 shadow-2xl border border-white">

    <div class="text-center mb-8">

        <h1 class="text-5xl font-black text-green-600 italic tracking-tight">
            FigurinhasCup
        </h1>

        <p class="text-gray-500 mt-3 text-sm">
            Entre na sua conta para anunciar figurinhas
        </p>

    </div>

    <form id="loginForm" class="space-y-4">

        <input
            type="email"
            id="email"
            placeholder="Seu email"
            required
            class="w-full p-4 rounded-2xl bg-gray-100 outline-none focus:ring-2 focus:ring-green-500"
        >

        <input
            type="password"
            id="senha"
            placeholder="Sua senha"
            required
            class="w-full p-4 rounded-2xl bg-gray-100 outline-none focus:ring-2 focus:ring-green-500"
        >

        <button
            class="w-full bg-green-600 text-white p-4 rounded-2xl font-black text-lg hover:scale-[1.02] transition-all"
        >
            ENTRAR
        </button>

    </form>

    <div class="text-center mt-6">

        <a
            href="registro.html"
            class="text-green-600 font-bold text-sm"
        >
            Criar nova conta
        </a>

    </div>

</div>

<script type="module">

import {
    auth
} from './firebase.js';

import {
    signInWithEmailAndPassword,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

const form = document.getElementById('loginForm');

onAuthStateChanged(auth, (user)=>{

    if(user){

        window.location.href = "index.html";

    }

});

form.addEventListener('submit', async(e)=>{

    e.preventDefault();

    const email =
        document.getElementById('email').value;

    const senha =
        document.getElementById('senha').value;

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            senha
        );

        alert("Login realizado!");

        window.location.href = "index.html";

    }catch(error){

        alert("Email ou senha inválidos");

    }

});

</script>

</body>
</html>
```
