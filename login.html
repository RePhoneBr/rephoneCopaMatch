<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | FigurinhasCup</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Inter', sans-serif;
}

.glass{
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
}

</style>

</head>

<body class="bg-gradient-to-br from-green-50 to-white min-h-screen flex items-center justify-center p-6">

<div class="glass w-full max-w-md rounded-[2rem] p-8 shadow-2xl border border-white">

    <div class="text-center mb-8">

        <h1 class="text-5xl font-black text-green-600 italic tracking-tight">
            FigurinhasCup
        </h1>

        <p class="text-gray-500 mt-3 text-sm">
            Entre na sua conta para anunciar figurinhas
        </p>

    </div>

    <form id="loginForm" class="space-y-4">

        <input
            type="email"
            id="email"
            placeholder="Seu email"
            required
            class="w-full p-4 rounded-2xl bg-gray-100 outline-none focus:ring-2 focus:ring-green-500"
        >

        <div class="relative">

            <input
                type="password"
                id="senha"
                placeholder="Sua senha"
                required
                class="w-full p-4 rounded-2xl bg-gray-100 outline-none focus:ring-2 focus:ring-green-500"
            >

            <button
                type="button"
                id="toggleSenha"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-bold text-gray-500"
            >
                Mostrar
            </button>

        </div>

        <button
            class="w-full bg-green-600 text-white p-4 rounded-2xl font-black text-lg hover:scale-[1.02] transition-all"
        >
            ENTRAR
        </button>

    </form>

    <!-- RECUPERAR SENHA -->

    <div class="text-center mt-5">

        <button
            id="btnRecuperar"
            class="text-sm font-bold text-gray-500 hover:text-green-600 transition"
        >
            Esqueci minha senha
        </button>

    </div>

    <!-- REGISTRO -->

    <div class="text-center mt-6">

        <a
            href="registro.html"
            class="text-green-600 font-bold text-sm"
        >
            Criar nova conta
        </a>

    </div>

    <!-- ALERTA -->

    <div
        id="msgBox"
        class="hidden mt-6 rounded-2xl p-4 text-sm font-bold"
    ></div>

</div>

<script type="module">

import {
    auth
} from './firebase.js';

import {
    signInWithEmailAndPassword,
    onAuthStateChanged,
    sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

const form =
    document.getElementById('loginForm');

const msgBox =
    document.getElementById('msgBox');


// ========================================
// ALERTA
// ========================================

function mostrarMensagem(msg, tipo = 'erro'){

    msgBox.classList.remove('hidden');

    if(tipo === 'sucesso'){

        msgBox.className =
        'mt-6 rounded-2xl p-4 text-sm font-bold bg-green-100 text-green-700';

    }else{

        msgBox.className =
        'mt-6 rounded-2xl p-4 text-sm font-bold bg-red-100 text-red-700';

    }

    msgBox.innerHTML = msg;

}


// ========================================
// AUTO LOGIN
// ========================================

onAuthStateChanged(auth, (user)=>{

    // Apenas verifica sessão
    // sem redirecionamento automático

    if(user){

        console.log("Usuário já logado");

    }

});


// ========================================
// LOGIN
// ========================================

form.addEventListener('submit', async(e)=>{

    e.preventDefault();

    const email =
        document.getElementById('email').value;

    const senha =
        document.getElementById('senha').value;

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            senha
        );

        mostrarMensagem(
            "Login realizado com sucesso.",
            "sucesso"
        );


    catch(error){

        console.error(error);

        mostrarMensagem(
            "Email ou senha inválidos."
        );

    }

});


// ========================================
// RECUPERAR SENHA
// ========================================

document
.getElementById('btnRecuperar')
.addEventListener('click', async()=>{

    const email =
        document.getElementById('email').value;

    if(!email){

        mostrarMensagem(
            "Digite seu email para recuperar a senha."
        );

        return;

    }

    try{

        await sendPasswordResetEmail(
            auth,
            email
        );

        mostrarMensagem(
            "Link de recuperação enviado para seu email.",
            "sucesso"
        );

    }

    catch(error){

        console.error(error);

        if(error.code === 'auth/user-not-found'){

            mostrarMensagem(
                "Nenhuma conta encontrada com este email."
            );

        }else if(error.code === 'auth/invalid-email'){

            mostrarMensagem(
                "Digite um email válido."
            );

        }else{

            mostrarMensagem(
                "Erro ao enviar recuperação."
            );

        }

    }

});


// ========================================
// MOSTRAR SENHA
// ========================================

document
.getElementById('toggleSenha')
.addEventListener('click', ()=>{

    const senha =
        document.getElementById('senha');

    if(senha.type === 'password'){

        senha.type = 'text';

        document
        .getElementById('toggleSenha')
        .innerHTML = 'Ocultar';

    }else{

        senha.type = 'password';

        document
        .getElementById('toggleSenha')
        .innerHTML = 'Mostrar';

    }

});

</script>

</body>
</html>
