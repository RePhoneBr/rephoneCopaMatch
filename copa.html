<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CopaMatch | Troca de Figurinhas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root { 
            --dark: #6b0b1a; /* Bordô Catar/Fifa */
            --gold: #bda677; 
            --green: #22c55e;
            --bg: #fdfaf3; 
            --text-muted: #64748b; 
            --blue: #2563eb; 
            --yellow: #facc15;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background: var(--bg); color: #1e293b; overflow-x: hidden; padding-bottom: 100px; }
        
        /* HEADER */
        .main-header { background: var(--dark); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-radius: 0 0 20px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .logo { font-weight: 900; font-size: 22px; color: white; text-decoration: none; text-transform: uppercase; letter-spacing: -1px; }
        .logo span { color: var(--yellow); }
        
        .ticker-wrapper { width: 100%; background: #4a0812; color: white; overflow: hidden; white-space: nowrap; padding: 10px 0; font-size: 11px; font-weight: 800; position: sticky; top: 55px; z-index: 999; }
        .ticker-content { display: inline-block; animation: ticker-animation 30s linear infinite; }
        @keyframes ticker-animation { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* CARDS FIGURINHAS */
        .feed { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 15px; padding: 10px; border: 1px solid #e2e8f0; position: relative; transition: 0.3s; display: flex; flex-direction: column; }
        
        .img-container { 
            width: 100%; 
            height: 140px; 
            background: #f1f5f9; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            margin-bottom: 8px;
            border: 2px solid #eee;
        }
        .card img { width: 80%; height: 80%; object-fit: contain; }
        
        .badge-raridade { position: absolute; top: 8px; right: 8px; background: var(--gold); color: #4a0812; font-size: 8px; padding: 4px 8px; border-radius: 6px; font-weight: 900; z-index: 5; }
        
        .info-selecao { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 6px; margin-top: 5px; align-self: flex-start; text-transform: uppercase; background: #f1f5f9; color: var(--text-muted); }

        .price-tag { background: linear-gradient(135deg, var(--dark), #921124); color: white; padding: 8px; border-radius: 10px; font-weight: 900; font-size: 14px; margin-top: auto; text-align: center; }

        /* FORMULÁRIO MATCH */
        .search-box { background:white; padding:20px; border-radius:25px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

        /* FOOTER */
        .rephone-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 15px; border-top: 1px solid #e2e8f0; display: flex; flex-direction: column; align-items: center; gap: 5px; z-index: 1000; }
    </style>
</head>
<body>

    <header class="main-header">
        <a href="#" class="logo">Copa<span>Match</span></a>
        <button style="background:none; border:none; color:white; font-size:28px;" onclick="toggleMenu()">☰</button>
    </header>

    <div class="ticker-wrapper">
        <div class="ticker-content">
            <span>⚽ TROQUE COM SEGURANÇA EM LOCAIS PÚBLICOS</span> — 
            <span>⭐ BUSCANDO AS LEGENDÁRIAS? USE O FILTRO DE MATCH</span> — 
            <span>🇧🇷 RUMO AO HEXA! COMPLETE SEU ÁLBUM HOJE</span>
        </div>
    </div>

    <div style="text-align:center; font-size:11px; padding:15px; color:var(--text-muted); font-weight:700;" id="txtLocation">📍 Buscando colecionadores próximos...</div>

    <section style="padding:10px 20px; max-width:600px; margin:0 auto;">
        <div class="search-box">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:15px;">
                <div id="mCircle" style="width:10px; height:10px; border-radius:50%; background:var(--gold);"></div>
                <span style="font-size:10px; font-weight:900; color:var(--dark);">ENCONTRAR FIGURINHA</span>
            </div>
            <input type="text" id="matchNumero" placeholder="Ex: BRA 10 ou 150" style="width:100%; padding:14px; border-radius:12px; border:1px solid #e2e8f0; margin-bottom:10px; outline:none;">
            <select id="matchTipo" style="width:100%; padding:14px; border-radius:12px; border:1px solid #e2e8f0; margin-bottom:15px; background:white;">
                <option value="todos">Qualquer tipo</option>
                <option value="normal">Normal</option>
                <option value="brilhante">Brilhante / Especial</option>
            </select>
            <button onclick="fazerMatch()" style="width:100%; background:var(--dark); color:white; padding:16px; border:none; border-radius:15px; font-weight:900; cursor:pointer;">BUSCAR AGORA</button>
        </div>
    </section>

    <main id="radarGrid" class="feed"></main>

    <footer class="rephone-footer">
        <div style="color:var(--dark); font-size:10px; font-weight:800;">PROJETO TEMPORÁRIO — COPA 2026</div>
        <div style="color:var(--text-muted); font-size:9px;">Troque, venda ou compre figurinhas com a comunidade.</div>
    </footer>

    <script type="module">
        // Simulação de Dados (Substitua pela sua config Firebase se for usar o DB)
        const mockFigurinhas = [
            { id: 1, numero: "BRA 10", selecao: "Brasil", tipo: "brilhante", preco: 50.00, statusVenda: "disponivel", vendedor: "particular", cidade: "São Paulo", lat: -23.55, lng: -46.63, foto: "https://via.placeholder.com/150?text=BRA+10" },
            { id: 2, numero: "ARG 10", selecao: "Argentina", tipo: "brilhante", preco: 45.00, statusVenda: "disponivel", vendedor: "lojista", cidade: "São Paulo", lat: -23.56, lng: -46.64, foto: "https://via.placeholder.com/150?text=ARG+10" },
            { id: 3, numero: "150", selecao: "Estádios", tipo: "normal", preco: 2.00, statusVenda: "disponivel", vendedor: "particular", cidade: "São Paulo", lat: -23.50, lng: -46.60, foto: "https://via.placeholder.com/150?text=150" }
        ];

        window.renderizar = (lista) => {
            const grid = document.getElementById('radarGrid');
            grid.innerHTML = "";
            
            lista.forEach(fig => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    ${fig.tipo === 'brilhante' ? '<div class="badge-raridade">ESPECIAL</div>' : ''}
                    <div class="img-container">
                        <img src="${fig.foto}" alt="Figurinha">
                    </div>
                    <div class="info-selecao">${fig.selecao}</div>
                    <h3 style="font-size:16px; font-weight:900; margin:5px 0;">${fig.numero}</h3>
                    <div style="font-size:10px; color:var(--green); font-weight:800; margin-bottom:10px;">
                        📍 ${fig.cidade}
                    </div>
                    <div class="price-tag">
                        R$ ${fig.preco.toLocaleString('pt-br', {minimumFractionDigits: 2})}
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        // Inicializar
        renderizar(mockFigurinhas);

        window.fazerMatch = () => {
            const num = document.getElementById('matchNumero').value.toLowerCase().trim();
            const tipo = document.getElementById('matchTipo').value;
            
            let filtrados = mockFigurinhas.filter(f => {
                const matchNum = num === "" || f.numero.toLowerCase().includes(num);
                const matchTipo = tipo === "todos" || f.tipo === tipo;
                return matchNum && matchTipo;
            });

            if(filtrados.length > 0) {
                renderizar(filtrados);
            } else {
                alert("Nenhuma figurinha encontrada com esses critérios.");
            }
        };
    </script>
</body>
</html>
