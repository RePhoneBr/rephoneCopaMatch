<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Meu Painel</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
rel="stylesheet"
>

<style>

body{
    font-family:'Inter', sans-serif;
}

.glass{
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(14px);
}

.card-hover{
    transition:0.3s;
}

.card-hover:hover{
    transform:translateY(-4px);
}

.loader{
    border:4px solid #f3f3f3;
    border-top:4px solid #16a34a;
    border-radius:50%;
    width:45px;
    height:45px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

</style>

</head>

<body class="bg-gray-100">

<header class="sticky top-0 z-50 glass border-b border-gray-200">

    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">

        <a
            href="index.html"
            class="text-3xl font-black text-green-600 italic"
        >
            FigurinhasCup
        </a>

        <div class="flex items-center gap-4">

            <a
                href="anunciar.html"
                class="bg-green-600 text-white px-5 py-2 rounded-full text-sm font-black"
            >
                + Anunciar
            </a>

            <button
                id="logoutBtn"
                class="bg-red-500 text-white px-5 py-2 rounded-full text-sm font-black"
            >
                Sair
            </button>

        </div>

    </div>

</header>

<section class="max-w-7xl mx-auto px-4 py-10">

    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 mb-10">

        <div>

            <span class="bg-green-100 text-green-700 px-4 py-2 rounded-full text-xs font-black uppercase">
                Painel do colecionador
            </span>

            <h1 class="text-5xl font-black mt-5">
                Meus anúncios
            </h1>

            <p class="text-gray-500 mt-3">
                Gerencie suas figurinhas anunciadas.
            </p>

        </div>

    </div>

    <div class="grid md:grid-cols-3 gap-6 mb-10">

        <div class="bg-white rounded-[2rem] p-6 border border-gray-100">

            <p class="text-gray-400 font-bold text-sm uppercase">
                Total anúncios
            </p>

            <h2
                id="totalAds"
                class="text-5xl font-black mt-3"
            >
                0
            </h2>

        </div>

        <div class="bg-white rounded-[2rem] p-6 border border-gray-100">

            <p class="text-gray-400 font-bold text-sm uppercase">
                Disponíveis
            </p>

            <h2
                id="ativosAds"
                class="text-5xl font-black mt-3 text-green-600"
            >
                0
            </h2>

        </div>

        <div class="bg-white rounded-[2rem] p-6 border border-gray-100">

            <p class="text-gray-400 font-bold text-sm uppercase">
                Vendidos
            </p>

            <h2
                id="vendidosAds"
                class="text-5xl font-black mt-3 text-red-500"
            >
                0
            </h2>

        </div>

    </div>

    <div
        id="loaderArea"
        class="flex justify-center py-20"
    >
        <div class="loader"></div>
    </div>

    <div
        id="cards"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
    ></div>

</section>

<script type="module">

import {
    auth,
    db
} from './firebase.js';

import {

    onAuthStateChanged,
    signOut

} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

import {

    collection,
    query,
    where,
    onSnapshot,
    deleteDoc,
    doc,
    updateDoc

} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const cards =
    document.getElementById('cards');

document
    .getElementById('logoutBtn')
    .addEventListener('click', ()=>{

        signOut(auth);

    });

onAuthStateChanged(auth, (user)=>{

    if(!user){

        window.location.href =
            "login.html";

        return;

    }

    carregarAnuncios(user.uid);

});

function carregarAnuncios(uid){

    const q =
        query(
            collection(db, "anuncios"),
            where("uid", "==", uid)
        );

    onSnapshot(q, (snapshot)=>{

        const anuncios =
            snapshot.docs.map(doc=>({
                id: doc.id,
                ...doc.data()
            }));

        renderizar(anuncios);

    });

}

function renderizar(lista){

    document
        .getElementById('loaderArea')
        .style.display = 'none';

    cards.innerHTML = "";

    const vendidos =
        lista.filter(a=>a.status === 'vendido');

    const ativos =
        lista.filter(a=>a.status !== 'vendido');

    document.getElementById('totalAds').innerHTML =
        lista.length;

    document.getElementById('ativosAds').innerHTML =
        ativos.length;

    document.getElementById('vendidosAds').innerHTML =
        vendidos.length;

    if(lista.length === 0){

        cards.innerHTML = `

        <div class="col-span-full bg-white rounded-[2rem] p-10 text-center border border-gray-100">

            <h2 class="text-3xl font-black">
                Nenhum anúncio ainda
            </h2>

            <p class="text-gray-500 mt-3">
                Comece publicando sua primeira figurinha.
            </p>

            <a
                href="anunciar.html"
                class="inline-block mt-6 bg-green-600 text-white px-8 py-4 rounded-2xl font-black"
            >
                Publicar agora
            </a>

        </div>

        `;

        return;

    }

    lista.forEach(ad=>{

        const vendido =
            ad.status === 'vendido';

        cards.innerHTML += `

        <div class="bg-white rounded-[2rem] p-5 border border-gray-100 relative overflow-hidden card-hover ${vendido ? 'opacity-60 grayscale' : ''}">

            ${vendido ? `

                <div class="absolute top-4 right-4 bg-red-500 text-white px-4 py-2 rounded-full text-xs font-black z-10">
                    VENDIDO
                </div>

            ` : ''}

            <img
                src="${ad.foto}"
                class="w-full h-56 object-cover rounded-2xl"
            >

            <div class="mt-5">

                <div class="flex items-center justify-between">

                    <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-black uppercase">

                        ${ad.tipo}

                    </span>

                    <span class="text-xs font-bold text-gray-400 uppercase">

                        ${ad.raridade}

                    </span>

                </div>

                <h2 class="text-2xl font-black mt-4">

                    ${ad.jogador}

                </h2>

                <p class="text-gray-500 text-sm mt-1">

                    ${ad.selecao} • #${ad.numero}

                </p>

                <div class="mt-4 text-sm text-green-700 font-bold">

                    📍 ${ad.cidade}

                </div>

                <div class="flex items-center justify-between mt-6">

                    <span class="text-2xl font-black">

                        R$ ${parseFloat(ad.preco).toFixed(2)}

                    </span>

                </div>

                <div class="grid grid-cols-2 gap-3 mt-6">

                    <a
                        href="anuncio.html?id=${ad.id}"
                        class="bg-black text-white p-3 rounded-2xl text-center font-black text-sm"
                    >
                        VER
                    </a>

                    ${
                        vendido ?

                        `

                        <button
                            onclick="reativar('${ad.id}')"
                            class="bg-green-600 text-white p-3 rounded-2xl font-black text-sm"
                        >
                            REATIVAR
                        </button>

                        `

                        :

                        `

                        <button
                            onclick="marcarVendido('${ad.id}')"
                            class="bg-yellow-500 text-white p-3 rounded-2xl font-black text-sm"
                        >
                            VENDIDO
                        </button>

                        `
                    }

                </div>

                <button
                    onclick="excluir('${ad.id}')"
                    class="w-full mt-3 bg-red-500 text-white p-3 rounded-2xl font-black text-sm"
                >
                    EXCLUIR
                </button>

            </div>

        </div>

        `;

    });

}

window.excluir = async(id)=>{

    const confirmar =
        confirm("Excluir anúncio?");

    if(!confirmar) return;

    await deleteDoc(
        doc(db, "anuncios", id)
    );

};

window.marcarVendido = async(id)=>{

    await updateDoc(
        doc(db, "anuncios", id),
        {
            status: "vendido"
        }
    );

};

window.reativar = async(id)=>{

    await updateDoc(
        doc(db, "anuncios", id),
        {
            status: "ativo"
        }
    );

};

</script>

</body>
</html>
