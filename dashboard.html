<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Meu Painel</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
}

.glass{
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(14px);
}

.card-hover{
    transition:0.3s;
}

.card-hover:hover{
    transform:translateY(-4px);
}

.loader{
    border:4px solid #f3f3f3;
    border-top:4px solid #16a34a;
    border-radius:50%;
    width:45px;
    height:45px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}
</style>

</head>

<body class="bg-gray-100 text-gray-900">

<header class="sticky top-0 z-50 glass border-b border-gray-200">

    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">

        <a
            href="index.html"
            class="text-2xl md:text-3xl font-black text-green-600 italic shrink-0"
        >
            FigurinhasCup
        </a>

        <div class="flex items-center gap-2 md:gap-4">

            <a
                href="anunciar.html"
                class="bg-green-600 text-white px-4 md:px-5 py-2 rounded-full text-xs md:text-sm font-black"
            >
                + Anunciar
            </a>

            <button
                id="logoutBtn"
                type="button"
                class="bg-red-500 text-white px-4 md:px-5 py-2 rounded-full text-xs md:text-sm font-black"
            >
                Sair
            </button>

        </div>

    </div>

</header>

<section class="max-w-7xl mx-auto px-4 py-8 md:py-10">

    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 mb-8 md:mb-10">

        <div>

            <span class="bg-green-100 text-green-700 px-4 py-2 rounded-full text-[10px] md:text-xs font-black uppercase">
                Painel do colecionador
            </span>

            <h1 class="text-3xl md:text-5xl font-black mt-5 leading-tight">
                Meus anúncios
            </h1>

            <p class="text-gray-500 mt-3 text-sm md:text-base">
                Gerencie suas figurinhas, interessados e vendas.
            </p>

        </div>

    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 mb-8 md:mb-10">

        <div class="bg-white rounded-[2rem] p-5 md:p-6 border border-gray-100">

            <p class="text-gray-400 font-bold text-xs md:text-sm uppercase">
                Total anúncios
            </p>

            <h2
                id="totalAds"
                class="text-4xl md:text-5xl font-black mt-3"
            >
                0
            </h2>

        </div>

        <div class="bg-white rounded-[2rem] p-5 md:p-6 border border-gray-100">

            <p class="text-gray-400 font-bold text-xs md:text-sm uppercase">
                Disponíveis
            </p>

            <h2
                id="ativosAds"
                class="text-4xl md:text-5xl font-black mt-3 text-green-600"
            >
                0
            </h2>

        </div>

        <div class="bg-white rounded-[2rem] p-5 md:p-6 border border-gray-100">

            <p class="text-gray-400 font-bold text-xs md:text-sm uppercase">
                Vendidos
            </p>

            <h2
                id="vendidosAds"
                class="text-4xl md:text-5xl font-black mt-3 text-red-500"
            >
                0
            </h2>

        </div>

        <div class="bg-white rounded-[2rem] p-5 md:p-6 border border-gray-100">

            <p class="text-gray-400 font-bold text-xs md:text-sm uppercase">
                Interessados
            </p>

            <h2
                id="interessesAds"
                class="text-4xl md:text-5xl font-black mt-3 text-yellow-500"
            >
                0
            </h2>

        </div>

    </div>

    <section
        id="interessadosArea"
        class="hidden mb-8 md:mb-10"
    >

        <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-5">

            <div>

                <span class="bg-yellow-100 text-yellow-700 px-4 py-2 rounded-full text-[10px] md:text-xs font-black uppercase">
                    Interessados agrupados
                </span>

                <h2 class="text-2xl md:text-3xl font-black mt-4 leading-tight">
                    Cliques de compra
                </h2>

                <p
                    id="interesseResumo"
                    class="text-gray-500 text-sm md:text-base mt-2"
                >
                    Os contatos ficam agrupados por figurinha.
                </p>

            </div>

        </div>

        <div
            id="interessadosLista"
            class="grid grid-cols-1 lg:grid-cols-2 gap-6"
        ></div>

    </section>

    <div
        id="loaderArea"
        class="flex justify-center py-20"
    >
        <div class="loader"></div>
    </div>

    <div
        id="cards"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
    ></div>

</section>

<script type="module">
import { auth, db } from './firebase.js';

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    onSnapshot,
    deleteDoc,
    doc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const cards = document.getElementById('cards');
const loaderArea = document.getElementById('loaderArea');
const totalAds = document.getElementById('totalAds');
const ativosAds = document.getElementById('ativosAds');
const vendidosAds = document.getElementById('vendidosAds');
const interessesAds = document.getElementById('interessesAds');
const logoutBtn = document.getElementById('logoutBtn');

const interessadosArea = document.getElementById('interessadosArea');
const interessadosLista = document.getElementById('interessadosLista');
const interesseResumo = document.getElementById('interesseResumo');

let interessesPorUid = [];
let interessesPorVendedorId = [];

logoutBtn.addEventListener('click', async () => {
    try {
        await signOut(auth);
        window.location.href = "login.html";
    } catch (error) {
        alert("Erro ao sair. Tente novamente.");
        console.error(error);
    }
});

onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    carregarAnuncios(user.uid);
    carregarInteressados(user.uid);
});

function carregarAnuncios(uid) {
    const q = query(
        collection(db, "anuncios"),
        where("uid", "==", uid)
    );

    onSnapshot(
        q,
        (snapshot) => {
            const anuncios = snapshot.docs.map((documento) => ({
                id: documento.id,
                ...documento.data()
            }));

            renderizar(anuncios);
        },
        (error) => {
            loaderArea.style.display = 'none';

            cards.innerHTML = `
                <div class="col-span-full bg-white rounded-[2rem] p-8 md:p-10 text-center border border-gray-100">
                    <h2 class="text-2xl md:text-3xl font-black">Erro ao carregar anúncios</h2>
                    <p class="text-gray-500 mt-3 text-sm md:text-base">Tente atualizar a página.</p>
                </div>
            `;

            console.error(error);
        }
    );
}

function carregarInteressados(uid) {
    const qUid = query(
        collection(db, "interesses"),
        where("vendedorUid", "==", uid)
    );

    const qVendedorId = query(
        collection(db, "interesses"),
        where("vendedorId", "==", uid)
    );

    onSnapshot(
        qUid,
        (snapshot) => {
            interessesPorUid = snapshot.docs.map((documento) => ({
                id: documento.id,
                ...documento.data()
            }));

            atualizarInteresses();
        },
        (error) => {
            console.error(error);
        }
    );

    onSnapshot(
        qVendedorId,
        (snapshot) => {
            interessesPorVendedorId = snapshot.docs.map((documento) => ({
                id: documento.id,
                ...documento.data()
            }));

            atualizarInteresses();
        },
        (error) => {
            console.error(error);
        }
    );
}

function atualizarInteresses() {
    const mapa = new Map();

    [
        ...interessesPorUid,
        ...interessesPorVendedorId
    ].forEach((item) => {
        mapa.set(item.id, item);
    });

    renderizarInteressados(
        Array.from(mapa.values())
    );
}

function texto(valor, fallback = "") {
    if (valor === undefined || valor === null || valor === "") {
        return fallback;
    }

    return String(valor);
}

function escapeHtml(valor) {
    const div = document.createElement('div');
    div.textContent = texto(valor);
    return div.innerHTML;
}

function limparTelefone(valor) {
    return String(valor || "").replace(/\D/g, "");
}

function linkWhatsapp(valor) {
    let numero = limparTelefone(valor);

    if (!numero) {
        return "#";
    }

    if (!numero.startsWith("55")) {
        numero = "55" + numero;
    }

    return `https://wa.me/${numero}`;
}

function formatarPreco(valor) {
    const numero = Number(valor);

    if (!Number.isFinite(numero)) {
        return "R$ 0,00";
    }

    return numero.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

function segundosData(item) {
    return item?.criadoEm?.seconds || item?.atualizadoEm?.seconds || 0;
}

function renderizar(lista) {
    loaderArea.style.display = 'none';
    cards.innerHTML = "";

    const vendidos = lista.filter((ad) => ad.status === 'vendido');
    const ativos = lista.filter((ad) => ad.status !== 'vendido' && ad.status !== 'reprovado');

    totalAds.textContent = lista.length;
    ativosAds.textContent = ativos.length;
    vendidosAds.textContent = vendidos.length;

    if (lista.length === 0) {
        cards.innerHTML = `
            <div class="col-span-full bg-white rounded-[2rem] p-8 md:p-10 text-center border border-gray-100">
                <h2 class="text-2xl md:text-3xl font-black">Nenhum anúncio ainda</h2>
                <p class="text-gray-500 mt-3 text-sm md:text-base">Comece publicando sua primeira figurinha.</p>
                <a href="anunciar.html" class="inline-block mt-6 bg-green-600 text-white px-6 md:px-8 py-4 rounded-2xl font-black text-sm md:text-base">
                    Publicar agora
                </a>
            </div>
        `;
        return;
    }

    lista.forEach((ad) => {
        const vendido = ad.status === 'vendido';

        const subtitulo =
            `${texto(ad.selecao, 'Coleção não informada')}${ad.numero ? ' • #' + ad.numero : ''}`;

        const card = document.createElement('div');

        card.className =
            `bg-white rounded-[2rem] p-5 border border-gray-100 relative overflow-hidden card-hover ${vendido ? 'opacity-60 grayscale' : ''}`;

        card.innerHTML = `
            ${vendido ? '<div class="absolute top-4 right-4 bg-red-500 text-white px-4 py-2 rounded-full text-[10px] md:text-xs font-black z-10">VENDIDO</div>' : ''}

            <img
                src="${escapeHtml(texto(ad.foto, 'https://placehold.co/600x400?text=Sem+foto'))}"
                alt="Foto da figurinha"
                class="w-full h-48 md:h-56 object-cover rounded-2xl"
            >

            <div class="mt-5">

                <div class="flex items-center justify-between gap-3">

                    <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-[10px] md:text-xs font-black uppercase truncate max-w-[62%]">
                        ${escapeHtml(texto(ad.categoriaFigurinha || ad.tipo, 'Figurinha'))}
                    </span>

                    <span class="text-[10px] md:text-xs font-bold text-gray-400 uppercase truncate">
                        ${escapeHtml(texto(ad.raridade, 'Normal'))}
                    </span>

                </div>

                <h2 class="text-xl md:text-2xl font-black mt-4 break-words">
                    ${escapeHtml(texto(ad.jogador, 'Sem nome'))}
                </h2>

                <p class="text-gray-500 text-xs md:text-sm mt-1 break-words">
                    ${escapeHtml(subtitulo)}
                </p>

                <div class="mt-4 text-xs md:text-sm text-green-700 font-bold break-words">
                    ${escapeHtml(texto(ad.cidade, 'Cidade não informada'))}
                </div>

                <div class="mt-6">
                    <span class="text-xl md:text-2xl font-black">
                        ${formatarPreco(ad.preco)}
                    </span>
                </div>

                <div class="grid grid-cols-2 gap-3 mt-6">

                    <a
                        href="anuncio.html?id=${encodeURIComponent(ad.id)}"
                        class="bg-black text-white p-3 rounded-2xl text-center font-black text-xs md:text-sm"
                    >
                        VER
                    </a>

                    <button
                        type="button"
                        class="${vendido ? 'bg-green-600' : 'bg-yellow-500'} text-white p-3 rounded-2xl font-black text-xs md:text-sm"
                        data-action="${vendido ? 'reativar' : 'vendido'}"
                        data-id="${ad.id}"
                    >
                        ${vendido ? 'REATIVAR' : 'VENDIDO'}
                    </button>

                </div>

                <button
                    type="button"
                    class="w-full mt-3 bg-red-500 text-white p-3 rounded-2xl font-black text-xs md:text-sm"
                    data-action="excluir"
                    data-id="${ad.id}"
                >
                    EXCLUIR
                </button>

            </div>
        `;

        cards.appendChild(card);
    });
}

function agruparInteresses(lista) {
    const pendentes = lista
        .filter((item) => item.status !== "vendido" && item.status !== "arquivado")
        .sort((a, b) => segundosData(b) - segundosData(a));

    const grupos = {};

    pendentes.forEach((item) => {
        const anuncioId = item.anuncioId;

        if (!anuncioId) {
            return;
        }

        if (!grupos[anuncioId]) {
            grupos[anuncioId] = {
                anuncioId,
                jogador: item.jogador,
                selecao: item.selecao,
                numero: item.numero,
                foto: item.foto,
                interesses: [],
                ultimoClique: 0
            };
        }

        const chaveInteressado =
            limparTelefone(item.compradorWhatsApp) ||
            item.compradorUid ||
            item.compradorEmail ||
            item.id;

        const jaExiste =
            grupos[anuncioId].interesses.some((existente) => {
                const chaveExistente =
                    limparTelefone(existente.compradorWhatsApp) ||
                    existente.compradorUid ||
                    existente.compradorEmail ||
                    existente.id;

                return chaveExistente === chaveInteressado;
            });

        if (!jaExiste) {
            grupos[anuncioId].interesses.push(item);
        }

        grupos[anuncioId].ultimoClique =
            Math.max(grupos[anuncioId].ultimoClique, segundosData(item));
    });

    return Object.values(grupos)
        .sort((a, b) => b.ultimoClique - a.ultimoClique);
}

function renderizarInteressados(lista) {
    interessadosArea.classList.remove('hidden');
    interessadosLista.innerHTML = "";

    const grupos = agruparInteresses(lista);
    const totalInteressados = grupos.reduce((total, grupo) => total + grupo.interesses.length, 0);

    interessesAds.textContent = totalInteressados;

    interesseResumo.textContent =
        grupos.length === 0
            ? "Nenhum interessado pendente no momento."
            : `${totalInteressados} interessado${totalInteressados === 1 ? '' : 's'} em ${grupos.length} figurinha${grupos.length === 1 ? '' : 's'}.`;

    if (grupos.length === 0) {
        interessadosLista.innerHTML = `
            <div class="bg-white rounded-[2rem] p-6 border border-gray-100 text-center">
                <p class="text-gray-500 text-sm md:text-base font-bold">
                    Nenhum interessado pendente.
                </p>
            </div>
        `;
        return;
    }

    grupos.forEach((grupo) => {
        const card = document.createElement('div');
        const idsInteresses = grupo.interesses.map((item) => item.id).join(',');

        const subtitulo =
            `${texto(grupo.selecao, 'Coleção')}${grupo.numero ? ' • #' + grupo.numero : ''}`;

        card.className =
            "bg-white rounded-[2rem] p-5 border border-gray-100";

        card.innerHTML = `
            <div class="flex gap-4">

                <img
                    src="${escapeHtml(texto(grupo.foto, 'https://placehold.co/200x200?text=Foto'))}"
                    alt="Foto da figurinha"
                    class="w-20 h-20 object-cover rounded-2xl shrink-0"
                >

                <div class="flex-1 min-w-0">

                    <h3 class="font-black text-base md:text-lg break-words">
                        ${escapeHtml(texto(grupo.jogador, 'Figurinha'))}
                    </h3>

                    <p class="text-xs md:text-sm text-gray-500 break-words">
                        ${escapeHtml(subtitulo)}
                    </p>

                    <div class="flex flex-wrap items-center gap-2 mt-3">
                        <span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-[10px] font-black uppercase">
                            ${grupo.interesses.length} interessado${grupo.interesses.length === 1 ? '' : 's'}
                        </span>

                        <span class="bg-gray-100 text-gray-500 px-3 py-1 rounded-full text-[10px] font-black uppercase">
                            Contatos agrupados
                        </span>
                    </div>

                </div>

            </div>

            <div
                id="interesses-${grupo.anuncioId}"
                class="hidden mt-4 space-y-3"
            >
                ${grupo.interesses.map((item) => {
                    const whatsapp = texto(item.compradorWhatsApp, 'WhatsApp não informado');
                    const href = linkWhatsapp(item.compradorWhatsApp);

                    return `
                        <div class="bg-gray-100 rounded-2xl p-4">
                            <div class="flex items-start justify-between gap-3">
                                <div class="min-w-0">
                                    <p class="text-sm font-black break-words">
                                        ${escapeHtml(texto(item.compradorNome, 'Interessado'))}
                                    </p>

                                    <p class="text-xs text-gray-500 break-words">
                                        ${escapeHtml(texto(item.compradorEmail))}
                                    </p>

                                    <p class="text-xs text-green-700 font-bold mt-1 break-words">
                                        ${escapeHtml(whatsapp)}
                                    </p>
                                </div>

                                <a
                                    href="${href}"
                                    target="_blank"
                                    class="bg-green-600 text-white px-4 py-2 rounded-xl text-xs font-black shrink-0"
                                >
                                    WHATS
                                </a>
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>

            <div class="grid grid-cols-2 gap-3 mt-4">

                <button
                    type="button"
                    class="bg-black text-white p-3 rounded-2xl font-black text-xs md:text-sm"
                    data-action="toggleInteresses"
                    data-id="${grupo.anuncioId}"
                >
                    VER CONTATOS
                </button>

                <button
                    type="button"
                    class="bg-green-600 text-white p-3 rounded-2xl font-black text-xs md:text-sm"
                    data-action="venderInteresse"
                    data-id="${grupo.anuncioId}"
                    data-interesses="${idsInteresses}"
                >
                    VENDIDA
                </button>

            </div>
        `;

        interessadosLista.appendChild(card);
    });
}

document.addEventListener('click', async (event) => {
    const button = event.target.closest('button[data-action]');

    if (!button) {
        return;
    }

    const { action, id, interesse, interesses } = button.dataset;

    if (action === 'toggleInteresses') {
        const box = document.getElementById(`interesses-${id}`);

        if (box) {
            box.classList.toggle('hidden');
        }

        return;
    }

    const textoOriginal = button.textContent;

    try {
        button.disabled = true;
        button.textContent = "PROCESSANDO...";

        if (action === 'excluir') {
            const confirmar = confirm("Excluir anúncio?");

            if (!confirmar) {
                return;
            }

            await deleteDoc(
                doc(db, "anuncios", id)
            );
        }

        if (action === 'vendido') {
            await updateDoc(
                doc(db, "anuncios", id),
                {
                    status: "vendido",
                    vendidoEm: serverTimestamp()
                }
            );
        }

        if (action === 'reativar') {
            await updateDoc(
                doc(db, "anuncios", id),
                {
                    status: "aprovado",
                    vendidoEm: null
                }
            );
        }

        if (action === 'venderInteresse') {
            const confirmar = confirm("Marcar esta figurinha como vendida?");

            if (!confirmar) {
                return;
            }

            await updateDoc(
                doc(db, "anuncios", id),
                {
                    status: "vendido",
                    vendidoEm: serverTimestamp()
                }
            );

            const ids =
                texto(interesses || interesse)
                    .split(',')
                    .filter(Boolean);

            await Promise.all(
                ids.map((interesseId) =>
                    updateDoc(
                        doc(db, "interesses", interesseId),
                        {
                            status: "vendido",
                            vendidoEm: serverTimestamp()
                        }
                    )
                )
            );
        }
    } catch (error) {
        alert("Não foi possível atualizar.");
        console.error(error);
    } finally {
        button.disabled = false;
        button.textContent = textoOriginal;
    }
});
</script>

</body>
</html>
