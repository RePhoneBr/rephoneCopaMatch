<script type="module">
import { auth, db } from './firebase.js';

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    onSnapshot,
    deleteDoc,
    doc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const cards = document.getElementById('cards');
const loaderArea = document.getElementById('loaderArea');
const totalAds = document.getElementById('totalAds');
const ativosAds = document.getElementById('ativosAds');
const vendidosAds = document.getElementById('vendidosAds');
const logoutBtn = document.getElementById('logoutBtn');

logoutBtn.addEventListener('click', async () => {
    try {
        await signOut(auth);
        window.location.href = "login.html";
    } catch (error) {
        alert("Erro ao sair. Tente novamente.");
        console.error(error);
    }
});

onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    carregarAnuncios(user.uid);
});

function carregarAnuncios(uid) {
    const q = query(
        collection(db, "anuncios"),
        where("uid", "==", uid)
    );

    onSnapshot(
        q,
        (snapshot) => {
            const anuncios = snapshot.docs.map((documento) => ({
                id: documento.id,
                ...documento.data()
            }));

            renderizar(anuncios);
        },
        (error) => {
            loaderArea.style.display = 'none';
            cards.innerHTML = `
                <div class="col-span-full bg-white rounded-[2rem] p-10 text-center border border-gray-100">
                    <h2 class="text-3xl font-black">Erro ao carregar anúncios</h2>
                    <p class="text-gray-500 mt-3">Tente atualizar a página.</p>
                </div>
            `;
            console.error(error);
        }
    );
}

function formatarPreco(valor) {
    const numero = Number(valor);

    if (!Number.isFinite(numero)) {
        return "R$ 0,00";
    }

    return numero.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

function renderizar(lista) {
    loaderArea.style.display = 'none';
    cards.innerHTML = "";

    const vendidos = lista.filter((ad) => ad.status === 'vendido');
    const ativos = lista.filter((ad) => ad.status !== 'vendido');

    totalAds.textContent = lista.length;
    ativosAds.textContent = ativos.length;
    vendidosAds.textContent = vendidos.length;

    if (lista.length === 0) {
        cards.innerHTML = `
            <div class="col-span-full bg-white rounded-[2rem] p-10 text-center border border-gray-100">
                <h2 class="text-3xl font-black">Nenhum anúncio ainda</h2>
                <p class="text-gray-500 mt-3">Comece publicando sua primeira figurinha.</p>
                <a href="anunciar.html" class="inline-block mt-6 bg-green-600 text-white px-8 py-4 rounded-2xl font-black">
                    Publicar agora
                </a>
            </div>
        `;
        return;
    }

    lista.forEach((ad) => {
        const vendido = ad.status === 'vendido';

        const card = document.createElement('div');
        card.className = `bg-white rounded-[2rem] p-5 border border-gray-100 relative overflow-hidden card-hover ${vendido ? 'opacity-60 grayscale' : ''}`;

        card.innerHTML = `
            ${vendido ? '<div class="absolute top-4 right-4 bg-red-500 text-white px-4 py-2 rounded-full text-xs font-black z-10">VENDIDO</div>' : ''}

            <img src="${ad.foto || 'https://placehold.co/600x400?text=Sem+foto'}" alt="Foto da figurinha ${ad.jogador || ''}" class="w-full h-56 object-cover rounded-2xl">

            <div class="mt-5">
                <div class="flex items-center justify-between gap-3">
                    <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-black uppercase">
                        ${ad.tipo || 'Figurinha'}
                    </span>

                    <span class="text-xs font-bold text-gray-400 uppercase">
                        ${ad.raridade || 'Normal'}
                    </span>
                </div>

                <h2 class="text-2xl font-black mt-4">${ad.jogador || 'Sem nome'}</h2>

                <p class="text-gray-500 text-sm mt-1">
                    ${ad.selecao || 'Seleção não informada'} • #${ad.numero || '--'}
                </p>

                <div class="mt-4 text-sm text-green-700 font-bold">
                    ${ad.cidade || 'Cidade não informada'}
                </div>

                <div class="flex items-center justify-between mt-6">
                    <span class="text-2xl font-black">${formatarPreco(ad.preco)}</span>
                </div>

                <div class="grid grid-cols-2 gap-3 mt-6">
                    <a href="anuncio.html?id=${encodeURIComponent(ad.id)}" class="bg-black text-white p-3 rounded-2xl text-center font-black text-sm">
                        VER
                    </a>

                    <button class="${vendido ? 'bg-green-600' : 'bg-yellow-500'} text-white p-3 rounded-2xl font-black text-sm" data-action="${vendido ? 'reativar' : 'vendido'}" data-id="${ad.id}">
                        ${vendido ? 'REATIVAR' : 'VENDIDO'}
                    </button>
                </div>

                <button class="w-full mt-3 bg-red-500 text-white p-3 rounded-2xl font-black text-sm" data-action="excluir" data-id="${ad.id}">
                    EXCLUIR
                </button>
            </div>
        `;

        cards.appendChild(card);
    });
}

cards.addEventListener('click', async (event) => {
    const button = event.target.closest('button[data-action]');
    if (!button) return;

    const { action, id } = button.dataset;

    try {
        if (action === 'excluir') {
            const confirmar = confirm("Excluir anúncio?");
            if (!confirmar) return;

            await deleteDoc(doc(db, "anuncios", id));
        }

        if (action === 'vendido') {
            await updateDoc(doc(db, "anuncios", id), {
                status: "vendido"
            });
        }

        if (action === 'reativar') {
            await updateDoc(doc(db, "anuncios", id), {
                status: "ativo"
            });
        }
    } catch (error) {
        alert("Não foi possível atualizar o anúncio.");
        console.error(error);
    }
});
</script>

</body>
</html>
