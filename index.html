<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>FigurinhasCup</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
rel="stylesheet"
>

<style>

body{
    font-family:'Inter', sans-serif;
}

.glass{
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(14px);
}

.card{
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 25px 40px rgba(0,0,0,0.08);
}

.loader{
    border:4px solid #f3f3f3;
    border-top:4px solid #16a34a;
    border-radius:50%;
    width:40px;
    height:40px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

</style>

</head>

<body class="bg-gray-100">

<header class="sticky top-0 z-50 glass border-b border-gray-200">

    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">

        <a
            href="index.html"
            class="text-3xl font-black text-green-600 italic"
        >
            FigurinhasCup
        </a>

        <div class="hidden md:flex gap-8 text-sm font-bold">

            <a href="#feed">Feed</a>

            <a href="#" id="btnAnunciar">
                Anunciar
            </a>

        </div>

        <div id="authArea">

            <a
                href="login.html"
                class="bg-black text-white px-5 py-2 rounded-full text-sm font-bold"
            >
                Entrar
            </a>

        </div>

    </div>

</header>

<section class="py-16 px-4">

    <div class="max-w-5xl mx-auto text-center">

        <span class="bg-green-100 text-green-700 px-4 py-2 rounded-full text-xs font-black uppercase">
            Marketplace inteligente de figurinhas
        </span>

        <h1 class="text-5xl md:text-7xl font-black mt-6 tracking-tight leading-none">
            Encontre sua figurinha faltante.
        </h1>

        <p class="text-gray-500 max-w-2xl mx-auto mt-6 text-lg">
            Troque, compre e venda figurinhas com colecionadores próximos.
        </p>

        <div class="bg-white rounded-[2rem] p-4 shadow-2xl mt-10 grid md:grid-cols-4 gap-4">

            <input
                type="text"
                id="searchInput"
                placeholder="Buscar figurinha..."
                class="md:col-span-3 p-4 rounded-2xl bg-gray-100 outline-none"
            >

            <button
                onclick="buscar()"
                class="bg-green-600 text-white rounded-2xl font-black"
            >
                BUSCAR
            </button>

        </div>

        <div
            id="locationText"
            class="mt-5 text-sm text-green-700 font-bold"
        >
            📍 Localizando colecionadores...
        </div>

    </div>

</section>

<section
    id="feed"
    class="px-4 pb-20"
>

    <div
        id="loaderArea"
        class="flex justify-center py-20"
    >
        <div class="loader"></div>
    </div>

    <div
        id="cards"
        class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"
    ></div>

</section>

<script type="module">

import {
    auth,
    db
} from './firebase.js';

import {

    collection,
    onSnapshot,
    query,
    orderBy

} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

import {

    onAuthStateChanged,
    signOut

} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

let anuncios = [];

let userLat = null;
let userLng = null;

function calcularDistancia(lat1, lon1, lat2, lon2){

    const R = 6371;

    const dLat =
        (lat2-lat1) * Math.PI/180;

    const dLon =
        (lon2-lon1) * Math.PI/180;

    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2) +

        Math.cos(lat1 * Math.PI/180) *
        Math.cos(lat2 * Math.PI/180) *

        Math.sin(dLon/2) *
        Math.sin(dLon/2);

    return (
        R * 2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        )
    ).toFixed(1);

}

navigator.geolocation.getCurrentPosition(async(pos)=>{

    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;

    try{

        const res =
            await fetch(
                `https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLat}&lon=${userLng}`
            );

        const data = await res.json();

        document.getElementById('locationText').innerHTML =
            `📍 Ofertas próximas de ${data.address.city || data.address.town}`;

    }catch(error){}

});

onAuthStateChanged(auth, async(user)=>{

    const authArea =
        document.getElementById('authArea');

    if(user){

        authArea.innerHTML = `

            <div class="flex items-center gap-3">

                <a
                    href="dashboard.html"
                    class="text-sm font-bold"
                >
                    Meu painel
                </a>

                <button
                    id="logoutBtn"
                    class="bg-red-500 text-white px-4 py-2 rounded-full text-sm font-bold"
                >
                    Sair
                </button>

            </div>

        `;

        document
            .getElementById('logoutBtn')
            .addEventListener('click', ()=>{

                signOut(auth);

            });

    }

});

const q =
    query(
        collection(db, "anuncios"),
        orderBy("criadoEm", "desc")
    );

onSnapshot(q, (snapshot)=>{

    anuncios =
        snapshot.docs.map(doc=>({
            id: doc.id,
            ...doc.data()
        }));

    renderizar(anuncios);

});

function renderizar(lista){

    document
        .getElementById('loaderArea')
        .style.display = 'none';

    const cards =
        document.getElementById('cards');

    cards.innerHTML = "";

    lista.forEach(ad=>{

        let distancia = "";

        if(
            userLat &&
            ad.lat
        ){

            distancia =
                calcularDistancia(
                    userLat,
                    userLng,
                    ad.lat,
                    ad.lng
                ) + " km";

        }

        cards.innerHTML += `

        <div class="card bg-white rounded-[2rem] p-5 border border-gray-100 relative overflow-hidden">

            <img
                src="${ad.foto}"
                class="w-full h-52 object-cover rounded-2xl"
            >

            <div class="mt-4">

                <div class="flex items-center justify-between">

                    <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-black uppercase">

                        ${ad.tipo}

                    </span>

                    <span class="text-xs font-bold text-gray-400">

                        ${ad.raridade || 'Comum'}

                    </span>

                </div>

                <h2 class="text-2xl font-black mt-3">

                    ${ad.jogador}

                </h2>

                <p class="text-gray-500 text-sm mt-1">

                    ${ad.selecao} • #${ad.numero}

                </p>

                <div class="mt-4 text-sm text-green-700 font-bold">

                    📍 ${ad.cidade}
                    ${distancia ? '• ' + distancia : ''}

                </div>

                <div class="flex items-center justify-between mt-6">

                    <span class="text-2xl font-black">

                        R$ ${parseFloat(ad.preco).toFixed(2)}

                    </span>

                    <a
                        href="anuncio.html?id=${ad.id}"
                        class="bg-black text-white px-5 py-3 rounded-full text-sm font-black"
                    >
                        VER
                    </a>

                </div>

            </div>

        </div>

        `;

    });

}

window.buscar = ()=>{

    const value =
        document
        .getElementById('searchInput')
        .value
        .toLowerCase();

    const filtrados =
        anuncios.filter(ad=>

            ad.jogador.toLowerCase().includes(value)
            ||

            ad.selecao.toLowerCase().includes(value)
            ||

            ad.numero.includes(value)

        );

    renderizar(filtrados);

};

document
    .getElementById('btnAnunciar')
    .addEventListener('click', ()=>{

        if(!auth.currentUser){

            window.location.href =
                "login.html";

            return;

        }

        window.location.href =
            "anunciar.html";

    });

</script>

</body>
</html>
